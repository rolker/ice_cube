# Copy to config.toml, which is not tracked by git, and edit for your setup.
# Command-line arguments take priority over these values.

[paths]
# Directory holding your survey data
data_dir = "data"
# Where generated figures and results are written
output_dir = "output"

# Season GeoPackage for QGIS: analysis/qgis/import_sessions.py, export_labels.py,
# build_project.py and the Ice Cube QGIS plugin, whose "Site config" setting takes this
# file (its own Settings, kept by QGIS, override gpkg, input_dir and layers; see
# docs/howto/qgis.md). The outputs hold positions: keep them out of
# the repository (your Drive season folder, or a local folder).
[season]
name = "2026-2027"
# Folder with the logger's session zips (IceCubeLogger_<session>.zip) and/or extracted
# session folders; searched recursively. Session zips or folders given on the command
# line are used instead.
input_dir = "data/sessions/2026-2027"
# Output GeoPackage; photos are extracted next to it in photos/<session>/
gpkg = "data/qgis/2026-2027.gpkg"
# Map-layer GeoJSON files (the logger's layers) imported as layer_<file>_<points|lines|polygons>
layers = ["data/layers/base.geojson", "data/layers/lot-boundary.geojson"]
# CSV written by export_labels.py (default: <gpkg stem>-captures.csv next to the gpkg)
# labels_csv = "data/qgis/2026-2027-captures.csv"

# Local copies of public orthophotos for QGIS: analysis/qgis/fetch_imagery.py (needs numpy
# and rasterio). Downloads each dataset over the extent once, resamples it into the local
# frame (datum corrected) and writes <out_dir>/<dataset>.tif + <dataset>.json; the QGIS
# project's "Imagery" group shows the GeoTIFFs in imagery/ next to the gpkg. The images
# show the site: never commit them. See docs/howto/qgis.md, Imagery.
[imagery]
# ArcGIS ImageServices folder (NH GRANIT, public, no token)
service = "https://granit24a.sr.unh.edu/image/rest/services/ImageServices"
datasets = ["NH_2021_2022_6in_RGB", "NH_2015_1ft_RGB", "NH_2010_2011_1ft_RGB", "NH_DOQs_92_98",
            "LiDAR_Bare_Earth_DEM_shaded_relief_NH_2022"]
# Output folder (default: imagery/ next to [season].gpkg)
# out_dir = "data/qgis/imagery"
# Extent: the bounding box of this GeoJSON ([lon, lat, h], our frame) plus margin_m, or an
# explicit bbox = [x_min, y_min, x_max, y_max] in local metres
extent_layer = "data/layers/lot-boundary.geojson"
margin_m = 30
# bbox = [-80.0, -30.0, 70.0, 95.0]
# Only the features of extent_layer whose properties match (e.g. the core parcels of
# fetch_parcels.py's output, for a wider "development" copy into another out_dir):
# extent_filter = { group = "core" }
# Download tile size, pixels (GRANIT answers HTTP 500 to 3000 x 3000 4-band requests)
# tile_px = 2048
# Image datum minus the frame of your coordinates at the site, metres [east, north]: for
# GRANIT (NAD83(2011)) against an ITRF2020/WGS84 base, NAD83 minus ITRF2020 there (HTDP or
# a 14-parameter transform at your epoch; about 1-2 m in the US). The images are moved by
# minus this. Without it the copies are not datum corrected (a warning says so).
# datum_shift_m = [0.0, 0.0]
# datum_note = "how the datum shift was found"
# Output pixel per dataset, metres (default: the native pixel rounded to the cm)
# [imagery.pixel_m]
# NH_2021_2022_6in_RGB = 0.15
# A measured residual of one image (imagery_check.py), metres [east, north], added to its move
# [imagery.extra_shift_m]
# NH_2015_1ft_RGB = [0.0, 0.0]
# Raster function per dataset ("" = raw pixels; default: raw for 8-bit services, else the
# service's first raster function, e.g. "Shaded Relief" for the LiDAR shaded relief)
# [imagery.rendering_rule]
# LiDAR_Bare_Earth_DEM_shaded_relief_NH_2022 = "Shaded Relief"
# Compression per dataset: "deflate" (default, lossless, alpha band) or "jpeg" (RGB
# JPEG-in-TIFF, internal mask, ~5x smaller: for very large photo copies)
# [imagery.compress]
# NH_2021_2022_6in_RGB = "jpeg"

# Tax-parcel polygons as a map layer: analysis/qgis/fetch_parcels.py (needs numpy). Owner
# names and addresses are never requested or written. Datum shift: [parcels].datum_shift_m,
# else [imagery].datum_shift_m. The output holds your location: keep it out of the repo.
[parcels]
# MapServer layer (NH GRANIT ParcelMosaic, layer 1 Parcels, public)
service = "https://nhgeodata.unh.edu/nhgeodata/rest/services/CAD/ParcelMosaic/MapServer/1"
# SQL selecting the core parcels (e.g. a subdivision by PID prefix) and/or single PIDs
where = "Town = 'Sometown' AND PID LIKE '001-002-%'"
# pids = ["001-003-000"]
# also the ring of parcels touching the core (vertex within neighbour_tolerance_m of an edge)
neighbours = true
neighbour_tolerance_m = 1.0
# fields kept (default PID, DisplayId, TownID, Town, SLU, SLUC, Shape_Area)
# fields = ["PID", "Town", "SLU", "Shape_Area"]
out = "data/layers/parcels.geojson"
# margin for the printed core extent, metres
margin_m = 40
# name of your frame, for the source note
# frame_name = "ITRF2020"

[site]
# The base: a known point kept in the gpkg (icecube_meta base_*), and the origin when
# [site.origin] is not set. First found wins: base, base_geojson, a kind=base Point in the
# layers above, then (if true) the first RTCM 1005 logged in the sessions. Never commit
# real values.
# base = [0.0, 0.0, 0.0]                     # lat, lon (degrees), ellipsoidal h (m)
base_geojson = "data/layers/base.geojson"    # a GeoJSON with a kind=base Point [lon, lat, h]
base_from_sessions = false

# Origin of the local frame: ROS-style ENU tangent plane, x east, y north, z up in metres
# (columns x_m, y_m, z_m of every point table, and the QGIS CRS "Ice Cube local ENU
# (origin <name>)", an orthographic projection at lat/lon). Use a durable, well-measured
# mark on the ground (a monument), measured position (not a fitted one), its ground
# height as h so the mark is z = 0. Changing it makes the next import recompute x/y/z_m
# of every row. Without it the base is the origin. Never commit real values.
# [site.origin]
# name = "G"                                   # short name, shown in the CRS name
# lat = 0.0                                    # degrees, WGS84 (the RTK frame of the base)
# lon = 0.0                                    # degrees
# h = 0.0                                      # ellipsoidal height of the mark (m)
# source = "where the numbers come from"

# Ground soundings for icecube: analysis/qgis/soundings.py writes a `soundings` table into
# the season gpkg (one row per ground height, with its sigma, pass and flags; see the
# script's docstring and docs/howto/ice-cube.md). Paths are relative to this file. Never
# commit real values (the files hold positions).
[soundings]
# gpkg = "data/qgis/2026-2027.gpkg"     # default: [season].gpkg
# csv = "data/qgis/soundings.csv"       # also write the rows to a CSV
# The base coordinates broadcast before the current one (the gpkg's base): CSV with
# start_utc, end_utc, lat, lon, h; positions taken then are moved by (current - then).
# base_history = "data/base_history.csv"
# Post-processed (PPK) results per capture: session, n, action (replace | flag), x_m, y_m,
# z_m, sigma_z, note. Missing file: nothing applied.
# corrections_csv = "data/ppk_corrections.csv"
settle_s = 90.0          # points within this many seconds of an RTK fix start are not trusted
suspect_jump_m = 1.0     # a fix that began with a bigger float-to-fix jump is suspect (false fix)
max_pass_s = 600.0       # a pass (one RTK bias for icecube) is cut after this long
# [soundings.sigma]      # the error budget (m): floor, floor_h, age_free_s, age_rate,
#                        # settle_extra, tip_sink, ground, tilt_bubble_deg, tilt_imu_deg, tilt_unknown_deg
# [soundings.stops]      # pole-stop detector: window_s = 2, max_h_m = 0.03, max_sd_z_m = 0.012,
#                        # imu_stable_deg = 0.5, imu_plumb_deg = 2, require_plumb = true

# Logger sessions: captures from the gpkg, pole stops from the raw sessions.
# [[soundings.sources]]
# id = "logger"
# type = "logger"
# station = 1234                         # the base's reference station id (others: excluded)
# prior_m = 0.015                        # expected RTK wander per pass on the home base
# session_paths = ["data/sessions/2026-2027"]
# [[soundings.sources.exclude]]          # known-bad captures (or utc = [[start, end]])
# session = "2026-12-01_10-00-00"
# n = [12, 13]
# reason = "false fix"

# SW Maps points with the receiver's NMEA log (.ubx with GGA and GST).
# [[soundings.sources]]
# id = "swmaps_dec"
# type = "swmaps"
# session = "2026-12-05_walk"
# date = "2026-12-05"
# station = 1234
# pole_m = 1.8
# prior_m = 0.015
# points_csv = ["data/swmaps/walk_Layer1.csv"]
# nmea_log = "data/swmaps/walk.ubx"

# SW Maps points on another network, moved by a measured ours-minus-theirs offset.
# [[soundings.sources]]
# id = "cors"
# type = "swmaps_points"
# session = "2026-10_cors"
# pole_m = 1.8
# base_history = false
# shift_enu = [0.0, 0.0, 0.0]            # east, north, up (m) added to every point
# shift_measured_utc = "2026-11-04T03:11:00Z"   # adds (current base - base in force then)
# prior_m = 0.04
# common_prior_m = 0.07                  # a bias shared by the whole survey
# points_csv = ["data/swmaps/topo.csv", "data/swmaps/things.csv"]
# classes = { "things" = "object" }      # layer file name part -> class (default ground)
