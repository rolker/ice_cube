name: GNSS Base Station
version: "0.3.0"
slug: gnss_base
description: Logs a GNSS base receiver, shows its status, and configures it as a base with confirmed commands.
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: true
uart: true
ingress: true
ingress_port: 8099
panel_icon: mdi:crosshairs-gps
panel_title: GNSS Base
map:
  - type: share
    read_only: false
options:
  device_match: USB_Dual_Serial
  baud: 460800
  log_dir: /share/gnss_base
  min_free_gb: 10
schema:
  device: device(subsystem=tty)
  device_match: str
  baud: int
  log_dir: str
  min_free_gb: float
