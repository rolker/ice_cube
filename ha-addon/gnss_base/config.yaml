name: GNSS Base Station
version: "0.6.3"
slug: gnss_base
description: Logs a GNSS base receiver, shows its status and a live measured position, checks its antenna against a CORS station by RTK, configures it as a base with confirmed commands, and serves its corrections.
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: true
uart: true
ingress: true
ingress_port: 8099
panel_icon: mdi:crosshairs-gps
panel_title: GNSS Base
map:
  - type: share
    read_only: false
ports:
  2101/tcp: 2101
ports_description:
  2101/tcp: NTRIP caster for rovers on your network (do not forward it on your router)
options:
  device_match: USB_Dual_Serial
  baud: 460800
  log_dir: /share/gnss_base
  min_free_gb: 10
  caster_enabled: true
  caster_mountpoint: BASE
  caster_user: ""
  caster_password: ""
  caster_max_clients: 16
  upload_host: rtk2go.com
  upload_port: 2101
  upload_mountpoint: ""
  upload_password: ""
  upload_style: rev1
  measured_enabled: true
  measured_elevation_mask: 15
  measured_snr_mask: 35
  reference_enabled: false
  reference_host: ""
  reference_port: 2101
  reference_mountpoint: ""
  reference_user: ""
  reference_password: ""
  reference_reset_utc: "00:00"
  base_frame: ITRF2020
  base_epoch: ""
schema:
  device: device(subsystem=tty)
  device_match: str
  baud: int
  log_dir: str
  min_free_gb: float
  caster_enabled: bool
  caster_mountpoint: match(^[A-Za-z0-9_]{1,32}$)
  caster_user: str
  caster_password: password
  caster_max_clients: int(1,16)
  upload_host: str
  upload_port: port
  upload_mountpoint: match(^[A-Za-z0-9_.-]{0,64}$)
  upload_password: password
  upload_style: list(rev1|rev2)
  measured_enabled: bool
  measured_elevation_mask: int(0,45)
  measured_snr_mask: int(0,50)
  reference_enabled: bool
  reference_host: str
  reference_port: port
  reference_mountpoint: str
  reference_user: str
  reference_password: password
  reference_frame: list(NAD83(2011)|ITRF2020|ITRF2014|ITRF2008)?
  reference_reset_utc: match(^([01]?[0-9]|2[0-3]):[0-5][0-9]$|^$)
  base_frame: list(ITRF2020|ITRF2014|ITRF2008|NAD83(2011))?
  base_epoch: str
