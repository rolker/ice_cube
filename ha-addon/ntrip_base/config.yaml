name: NTRIP Base Station
version: "1.1.0"
slug: ntrip_base
description: Serves RTCM3 corrections from a USB GNSS base receiver as an NTRIP caster on your LAN (RTKLIB str2str)
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
uart: true
ports:
  2101/tcp: 2101
  2102/tcp: 2102
ports_description:
  2101/tcp: NTRIP caster (point SW Maps here)
  2102/tcp: Receiver control, no password (only listens when control is on)
options:
  baud: 460800
  mountpoint: BASE
  username: rover
  password: changeme
  extra_output: ""
  control: false
schema:
  device: device(subsystem=tty)
  baud: int
  mountpoint: match(^[A-Za-z0-9_]+$)
  username: match(^[A-Za-z0-9_]+$)
  password: match(^[A-Za-z0-9_]+$)
  extra_output: str?
  control: bool
