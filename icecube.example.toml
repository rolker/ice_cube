# Ice-Cube config. Copy to a private file (anything with real coordinates must stay
# out of the repository) and run:  python -m icecube run my-rink.toml [--out DIR]
# Command-line arguments take priority over these values. Paths are relative to this
# file unless absolute.

[site]
# Local (0, 0) in UTM metres of the given zone; never commit real values.
utm_zone = 19
origin = [0.0, 0.0]
# Alternatively take `origin_utm19n` from the siting scripts' site_config.json so both
# tools share an origin:
# site_config = "analysis/site_config.json"
# Height subtracted from every point (m); 0 keeps the file's heights.
z0 = 0.0
# Or use the project's local frame: exact ENU (x east, y north, z up) about a geodetic
# origin, the same frame as the QGIS session import ([site.origin] of its site.toml) and
# the logger map (kind="origin" layer point). Copy lat, lon and ellipsoidal h of that
# origin here (in your private copy only) and leave out `origin` and `site_config`:
# origin_geodetic = [0.0, 0.0, 0.0]   # lat, lon (degrees), h (m, ellipsoidal)
# Or read that origin from the season GeoPackage (icecube_meta origin_lat/lon/h), so no
# number is copied anywhere (use alone, without origin / origin_geodetic / site_config):
# origin_from_gpkg = "data/qgis/2026-2027.gpkg"

[defaults]
sigma_z = 0.015           # m, per-point vertical sigma when the file has none
sigma_h = 0.01            # m, per-point horizontal sigma when the file has none
wander_prior = 0.03       # m, prior sigma of the per-pass vertical bias
crossover_radius = 0.5    # m, pass-cell size and pairing distance for crossovers
slope = 0.05              # m/m, vertical allowance per metre of horizontal separation
separable_ratio = 0.8     # a pass whose posterior sigma stays above this x prior is "not separable"
min_pairs = 3             # ... or that has fewer overlaps than this
max_dz = 0.25             # m, pairs differing by more are not the same surface and are dropped
reject_sigma = 4.0        # pairs with a larger normalised residual are dropped and the solve repeated

[grid]
cell = 0.5                # m
capture_radius = 0.75     # m, a sounding feeds every node within this distance
k_sigma = 3.0             # inconsistency test threshold
margin = 1.0              # m around the outline (or the points) when extent is not given
# extent = [xmin, xmax, ymin, ymax]   # local metres

[outline]                 # optional: a Polygon feature used for masks and figures
path = "data/outlines.geojson"
name = "rink"

[output]
dir = "output/ice-cube"

# One [[surveys]] block per file. `surface` groups surveys into one surface (e.g. two
# ground survey days); `frame` must match within a surface and between growth pairs.
# role = "surface" (default) or "validation" (crossover check only, no mask/growth).
[[surveys]]
id = "ground_a"
surface = "ground"
date = "2026-10-18"
frame = "NAD83(2011)"
reader = "swmaps_csv"              # swmaps_geojson | swmaps_csv | enu_csv
path = "data/topo.csv"
keep_quality = [4]                 # SW Maps Fix ID values to keep (drops them before
                                   # segmentation, so use pass_rule.fixed_only instead if a
                                   # loss of fix should end a pass)
exclude_remarks = ["deck"]         # drop points whose remark contains any of these
# z_min = -1.0 ; z_max = 1.0        # local height window
# drop_seq = [12, 13]               # drop points by file order
# offset = [0.0, 0.0, 0.0]          # dx, dy, dz added (frame shift, if you know it)
# pole_height = 0.0                 # subtracted from heights (antenna -> ground)
[surveys.pass_rule]
gap_s = 120.0                      # new pass after a time gap (s)
jump_m = 3.0                       # new pass after a horizontal jump (m)
# markers = ["ref"]                # new pass at a point whose remark contains this
# fixed_only = true                # keep only quality 4, non-fixed points break passes
# max_s = 600.0                    # cut passes longer than this (s)
# settle_s = 90.0                  # drop the first seconds of every pass
# min_points = 3

[[surveys]]
id = "ice_1"
date = "2026-02-14"
frame = "NAD83(2011)"
reader = "swmaps_geojson"
path = "data/ice_1.geojson"
geometry = "point"                 # or "polygon" with names = ["rink"] for vertices
exclude_remarks = ["ref"]
[surveys.pass_rule]
jump_m = 3.0

[[growth]]
from = "ground"
to = "ice_1"
# offset = 0.0   # required when the frames differ: added to `from` heights

[[fill]]
surface = "ground"
# level = 0.0    # local metres; default: `percentile` of the surface + `margin`
margin = 0.05
percentile = 99.0

# ----------------------------------------------------------------------------------------
# Topography mode: with one or more [[grids]] the run grids every surface on every grid,
# applies [[masks]], and writes ESRI ASCII grids, contours and a points-by-pass table
# (icecube/topo.py; docs/howto/ice-cube.md "Property topography"). [grid] and [outline]
# are then not used.
#
# [output]
# prj_from_gpkg = "data/qgis/2026-2027.gpkg"   # .prj next to each .asc: the gpkg's local CRS
#
# [[masks]]                     # no ground here: soundings inside dropped, nodes left empty
# path = "data/masks.geojson"   # Polygons, lon/lat
# kinds = ["structure", "rock"] # and/or names = ["deck", "garden shed"]
#
# [[grids]]
# name = "lot"
# cell = 1.0
# capture_radius = 1.5
# extent_polygon = { path = "data/regions.geojson", name = "lot" }   # or extent = [xmin, xmax, ymin, ymax]
# margin = 10.0
# lot = true                    # draw this polygon on every map
# slope_from_dem = { survey = "lidar", factor = 0.5, floor = 0.05, cap = 0.5 }   # or slope = 0.10
# contour_interval = 0.25
#
# [[surveys]]                   # the soundings table (analysis/qgis/soundings.py)
# id = "logger"
# surface = "ground"
# frame = "local"
# date = "2026-11-11"
# reader = "soundings"
# path = "data/qgis/2026-2027.gpkg"   # or its CSV export
# sources = ["logger"]          # rows of these sources; classes ground + anchor, use = 1
# wander_prior = 0.015          # default: the table's prior_m
# # common_prior = 0.07         # a bias shared by all passes of this survey
# [surveys.pass_rule]
# from_file = true              # the table's passes
#
# [[surveys]]                   # a bare-earth DEM as low-weight soundings (icecube/dem.py)
# id = "lidar"
# surface = "ground"
# frame = "local"
# date = "2022-04-01"
# reader = "dem"
# path = "data/lidar_local.npz" # xs, ys (local m), Z; or an .asc in local metres
# tie = 0.0                     # added to Z (e.g. NAVD88 -> local z), measured against RTK
# extent = [-80.0, 80.0, -80.0, 80.0]
# sigma_open = 0.10
# sigma_rough = 0.20
# rough_slope = 0.15
# rough_rms = 0.05
# sigma_h = 0.3
# capture_radius = 1.5          # a floor on every grid's capture radius for this survey
# check_rtk = true              # samples off nearby RTK by > check_dz get sigma_bad
# check_radius = 1.0
# check_dz = 0.20
# sigma_bad = 0.30
# tile_m = 10.0                 # tiles are passes: correlated DEM error
# wander_prior = 0.05           # per tile
# common_prior = 0.10           # the DEM as a whole
# [surveys.pass_rule]
# from_file = true
#
# [[fill]]                      # in topography mode: per grid and outline
# surface = "ground"
# grid = "rink"
# outline = { path = "data/regions.geojson", name = "rink" }
# percentile = 95.0
# margin = 0.10
